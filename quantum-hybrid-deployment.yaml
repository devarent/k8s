apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-hybrid
  namespace: multi-project
  labels:
    app: quantum-hybrid
    tier: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantum-hybrid
  template:
    metadata:
      labels:
        app: quantum-hybrid
        tier: ml
    spec:
      containers:
      - name: quantum-hybrid
        image: quantum-hybrid:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: ML_GPU_ENABLED
          value: "true"
        - name: ML_MODEL_PATH
          value: "/app/models"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: ml-models-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: ml-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: quantum-hybrid-service
  namespace: multi-project
  labels:
    app: quantum-hybrid
spec:
  selector:
    app: quantum-hybrid
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-models-pvc
  namespace: multi-project
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-data-pvc
  namespace: multi-project
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
